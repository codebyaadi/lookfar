services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lookfar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lookfar}
      POSTGRES_DB: lookfar
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookfar -d lookfar"]
      interval: 5s
      timeout: 3s
      retries: 10

  lookfar:
    build: .
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://lookfar:${POSTGRES_PASSWORD:-lookfar}@postgres:5432/lookfar?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
