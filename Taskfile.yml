version: '3'

# Run with `go tool task <name>` (pinned in go.mod), or `task <name>` if go-task is installed.

vars:
  BIN: bin/lookfar{{exeExt}}
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    cmds:
      - go tool task --list
    silent: true

  check:
    desc: Run every check (Go and web)
    cmds:
      - task: go:check
      - task: web:check

  go:check:
    desc: gofmt, golangci-lint and go test
    cmds:
      - task: go:fmt-check
      - task: generate:check
      - go tool golangci-lint run ./...
      - go test ./...

  go:fmt-check:
    internal: true
    cmds:
      - cmd: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

  web:install:
    internal: true
    dir: web
    cmds:
      - bun install --frozen-lockfile

  web:check:
    desc: Web lint, format check, typecheck and tests
    dir: web
    deps: [web:install]
    cmds:
      - bun run lint
      - bun run format
      - bun run check
      - bun run test

  web:build:
    desc: Build the SPA into internal/webui/dist
    dir: web
    deps: [web:install]
    cmds:
      - bun run build
      - cmd: touch ../internal/webui/dist/.gitkeep

  build:
    desc: Build the web app and the lookfar binary into bin/
    cmds:
      - task: web:build
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.BIN}} ./cmd/lookfar

  dev:
    desc: Run lookfar serve with live reload (air)
    cmds:
      - go tool air --build.cmd "go build -o ./tmp/lookfar{{exeExt}} ./cmd/lookfar" --build.entrypoint "./tmp/lookfar{{exeExt}}" --build.args_bin serve

  generate:
    desc: Regenerate code (sqlc; the OpenAPI client lands here later)
    cmds:
      - go tool sqlc generate

  generate:check:
    desc: Fail if generated code is out of date
    cmds:
      - go tool sqlc diff

  test:integration:
    desc: Run integration tests against Postgres in Docker (testcontainers)
    cmds:
      - go test -tags integration -count=1 -p 1 ./...

  smoke:
    desc: Opt-in live smoke test (hits cisa.gov and osv.dev, needs Docker Postgres); not part of check
    env:
      DATABASE_URL: postgres://lookfar:lookfar@localhost:5432/lookfar?sslmode=disable
    cmds:
      - task: db
      - go run ./cmd/lookfar run collect_kev
      - go run ./cmd/lookfar run collect_kev
      - go run ./cmd/lookfar run stack_sync --config internal/stack/testdata/lookfar.sample.yaml
      - go run ./cmd/lookfar run collect_osv
      - go run ./cmd/lookfar run collect_osv

  db:
    desc: Start Postgres in Docker and wait until it is healthy
    cmds:
      - docker compose up -d --wait postgres
