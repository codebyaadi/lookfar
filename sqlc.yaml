version: "2"
sql:
  - engine: postgresql
    schema: sql/schema
    queries: sql/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: pg_catalog.float8
            nullable: true
            go_type:
              type: float64
              pointer: true
